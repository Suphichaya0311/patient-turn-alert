<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turning Care System</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#d4f8e8,#b7f7d4,#9df0c0);
  overflow-x:hidden;
  text-align:center;
}

/* วงกลมลอย */
.circle{
  position:fixed;
  bottom:-120px;
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  animation:floatUp linear infinite;
  z-index:0;
}
@keyframes floatUp{
  from{transform:translateY(0);}
  to{transform:translateY(-120vh);}
}

/* Welcome */
#welcome{
  position:fixed;
  width:100%;
  height:100vh;
  background:linear-gradient(to bottom,#b2f7d8,#8ef0c3);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}
#welcome h1{
  font-size:45px;
  color:#065f46;
}
#welcome img{
  width:250px;
  border-radius:20px;
  margin:20px 0;
  box-shadow:0 0 20px #34d399;
}

button{
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:25px;
  background:#10b981;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover{opacity:0.85}

.container{
  display:none;
  position:relative;
  margin:100px auto;
  width:90%;
  padding:30px;
  background:white;
  border-radius:25px;
  box-shadow:0 0 30px #10b981;
  z-index:2;
}

#countdown{
  font-size:55px;
  margin:20px 0;
  color:#065f46;
}

/* Alert */
.alert{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:red;
  color:white;
  font-size:45px;
  font-weight:bold;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:20;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%{background:red;}
  50%{background:#8b0000;}
  100%{background:red;}
}

.history, .album{
  margin-top:20px;
  padding:15px;
  background:#eafff6;
  border-radius:15px;
  max-height:200px;
  overflow:auto;
  text-align:left;
}

.album img{
  width:120px;
  margin:5px;
  border-radius:10px;
}

video{
  width:250px;
  border-radius:15px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- Welcome -->
<div id="welcome">
  <h1>Turning Care System</h1>
  <img src="เวลาพลิกตัว.jpg">
  <button onclick="enterSystem()">เข้าสู่ระบบ</button>
</div>

<!-- Alert -->
<div class="alert" id="alertBox">
  ⛔ ถึงเวลาพลิกตัวผู้ป่วย ⛔
  <br><br>
  <button onclick="stopAlert()">ปิดแจ้งเตือน</button>
</div>

<!-- Main -->
<div class="container" id="mainSystem">
  <h2>ระบบแจ้งเตือนพลิกตัวผู้ป่วย</h2>

  <select id="timeSelect">
    <option value="30">30 วินาที</option>
    <option value="1800">30 นาที</option>
    <option value="3600">1 ชั่วโมง</option>
    <option value="7200">2 ชั่วโมง</option>
  </select>
  <br>

  <button onclick="startTimer()">เริ่ม</button>
  <button onclick="resetTimer()">รีเซ็ต</button>

  <div id="countdown">00:00</div>

  <h3>กล้อง</h3>
  <video id="camera" autoplay></video>
  <br>
  <button onclick="startCamera()">เปิดกล้อง</button>
  <button onclick="stopCamera()">ปิดกล้อง</button>

  <div class="history">
    <h3>ประวัติการแจ้งเตือน</h3>
    <ul id="historyList"></ul>
  </div>

  <div class="album">
    <h3>อัลบั้มรูปจากกล้อง</h3>
    <div id="albumList"></div>
  </div>
</div>

<audio id="alarmSound" src="alarm.mp3" loop></audio>

<script>
let timer;
let timeLeft=0;
let stream=null;

function enterSystem(){
  document.getElementById("welcome").style.display="none";
  document.getElementById("mainSystem").style.display="block";
}

/* Timer */
function startTimer(){
  clearInterval(timer);
  timeLeft=parseInt(document.getElementById("timeSelect").value);
  updateDisplay();
  timer=setInterval(()=>{
    timeLeft--;
    updateDisplay();
    if(timeLeft<=0){
      clearInterval(timer);
      triggerAlert();
    }
  },1000);
}

function resetTimer(){
  clearInterval(timer);
  timeLeft=0;
  updateDisplay();
}

function updateDisplay(){
  let min=Math.floor(timeLeft/60);
  let sec=timeLeft%60;
  document.getElementById("countdown").innerText=
    String(min).padStart(2,'0')+":"+
    String(sec).padStart(2,'0');
}

/* Alert */
function triggerAlert(){
  document.getElementById("alertBox").style.display="flex";
  document.getElementById("alarmSound").play();
  saveHistory();
  capturePhoto();
}

function stopAlert(){
  document.getElementById("alertBox").style.display="none";
  let sound=document.getElementById("alarmSound");
  sound.pause();
  sound.currentTime=0;
}

/* History */
function saveHistory(){
  let now=new Date();
  let timeString=now.toLocaleString();
  let li=document.createElement("li");
  li.textContent="แจ้งเตือนเมื่อ: "+timeString;
  document.getElementById("historyList").appendChild(li);
}

/* Camera */
async function startCamera(){
  stream=await navigator.mediaDevices.getUserMedia({video:true});
  document.getElementById("camera").srcObject=stream;
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }
}

/* Capture Photo */
function capturePhoto(){
  let video=document.getElementById("camera");
  if(!stream) return;

  let canvas=document.createElement("canvas");
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  let ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  let img=document.createElement("img");
  img.src=canvas.toDataURL("image/png");

  document.getElementById("albumList").appendChild(img);
}

/* Floating circles */
for(let i=0;i<25;i++){
  let circle=document.createElement("div");
  circle.className="circle";
  let size=Math.random()*100+30;
  circle.style.width=size+"px";
  circle.style.height=size+"px";
  circle.style.left=Math.random()*100+"%";
  circle.style.animationDuration=(Math.random()*15+10)+"s";
  document.body.appendChild(circle);
}
</script>

</body>
</html>
