<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Group 7 Turning Care System</title>
<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg,#d4f8e8,#b7f7d4,#9df0c0,#c8ffe6);
    background-size:400% 400%;
    animation: gradientBG 12s ease infinite;
    overflow-x:hidden;
}
@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Welcome Screen */
#welcome{
    position:fixed;
    width:100%;
    height:100vh;
    background:linear-gradient(to bottom,#b2f7d8,#8ef0c3);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
}
#welcome h1{
    font-size:50px;
    color:#065f46;
}
#welcome button{
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:30px;
    background:#10b981;
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px #34d399;
}
#welcome button:hover{
    transform:scale(1.05);
}

/* Floating circles */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    animation: floatUp 15s infinite;
}
@keyframes floatUp{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-10vh);}
}

/* ECG line */
.ecg{
    position:fixed;
    bottom:0;
    width:100%;
    height:120px;
    background:url('https://i.imgur.com/3Xj3Z5K.png') repeat-x;
    background-size:contain;
    animation:ecgMove 5s linear infinite;
    opacity:0.3;
}
@keyframes ecgMove{
    0%{background-position:0 0;}
    100%{background-position:1000px 0;}
}

/* Main Box */
.container{
    margin:120px auto;
    text-align:center;
    width:80%;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.8);
    box-shadow:0 0 30px #10b981;
}

button{
    padding:10px 25px;
    margin:10px;
    border:none;
    border-radius:20px;
    background:#10b981;
    color:white;
    cursor:pointer;
}

#history{
    margin-top:20px;
    max-height:150px;
    overflow:auto;
    text-align:left;
}

/* Album */
#album{
    display:none;
    margin-top:20px;
}
img{
    max-width:200px;
    margin:10px;
    border-radius:15px;
}
</style>
</head>
<body>

<div id="welcome">
    <h1>Turning Care System</h1>
    <h2>Group 7</h2>
    <!-- ตรงนี้ไว้ใส่วิดีโอทีหลัง -->
    <div id="videoArea" style="width:60%;height:200px;border:2px dashed #065f46;border-radius:20px;margin:20px;">
        วางวิดีโอเปิดตัวตรงนี้
    </div>
    <button onclick="enterSite()">เข้าสู่ระบบ</button>
</div>

<div class="ecg"></div>

<div class="container">
    <h2>ระบบแจ้งเตือนพลิกตัวผู้ป่วย</h2>
    <h1 id="countdown">00:00</h1>
    <button onclick="startTimer()">เริ่มนับ</button>
    <button onclick="stopTimer()">หยุด</button>
    <button onclick="showAlbum()">ดูอัลบั้ม</button>

    <h3>ประวัติการแจ้งเตือน</h3>
    <div id="history"></div>

    <h3>ภาพท่าพลิกตัว</h3>
    <img src="เวลาพลิกตัว.jpg">
    
    <div id="album">
        <h3>อัลบั้มรูปที่บันทึก</h3>
        <div id="albumImages"></div>
    </div>
</div>

<script>
let timer;
let seconds = 10; // ตั้งเวลา (ทดสอบ 10 วิ)
let original = seconds;

function enterSite(){
    document.getElementById("welcome").style.display="none";
}

function startTimer(){
    timer = setInterval(()=>{
        seconds--;
        let min = Math.floor(seconds/60);
        let sec = seconds%60;
        document.getElementById("countdown").innerText =
            String(min).padStart(2,'0') + ":" + String(sec).padStart(2,'0');

        if(seconds<=0){
            clearInterval(timer);
            alert("ถึงเวลาพลิกตัวผู้ป่วย!");
            saveImage();
            seconds = original;
        }
    },1000);
}

function stopTimer(){
    clearInterval(timer);
}

function saveImage(){
    let now = new Date();
    let timeString = now.toLocaleTimeString();
    let img = document.createElement("img");
    img.src="เวลาพลิกตัว.jpg";
    document.getElementById("albumImages").appendChild(img);

    let record = document.createElement("div");
    record.innerText = "บันทึกเมื่อ: " + timeString;
    document.getElementById("history").appendChild(record);
}

function showAlbum(){
    let album = document.getElementById("album");
    album.style.display = album.style.display==="none"?"block":"none";
}

/* สร้างวงกลมลอย */
for(let i=0;i<15;i++){
    let circle=document.createElement("div");
    circle.classList.add("circle");
    circle.style.width=Math.random()*80+20+"px";
    circle.style.height=circle.style.width;
    circle.style.left=Math.random()*100+"%";
    circle.style.animationDuration=Math.random()*10+10+"s";
    document.body.appendChild(circle);
}
</script>

</body>
</html>
