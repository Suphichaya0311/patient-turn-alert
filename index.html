<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient Turn Alert</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f4f8fb;
    margin:0;
}
h1{color:#0d3b66;}

button, select{
    padding:10px 20px;
    margin:5px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.start{background:#2a9d8f;color:white;}
.stop{background:#e63946;color:white;}
.camera{background:#457b9d;color:white;}
.albumBtn{background:#6a4c93;color:white;}

video{
    margin-top:10px;
    border-radius:10px;
    width:300px;
}

#countdown{
    font-size:42px;
    margin:15px;
    font-weight:bold;
    color:#0d3b66;
}

#alertBox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:red;
    color:white;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:50px;
    animation:pulse 1s infinite;
    z-index:1000;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

#album{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    overflow:auto;
    padding:20px;
    z-index:999;
}

.snapshotBox{
    display:inline-block;
    margin:10px;
    text-align:center;
}

.snapshot{
    width:200px;
    border-radius:10px;
}

#history{
    margin-top:20px;
}

</style>
</head>

<body>

<h1>Patient Turn Alert</h1>

<select id="timeSelect">
    <option value="30">30 วินาที</option>
    <option value="1800">30 นาที</option>
    <option value="3600">1 ชั่วโมง</option>
    <option value="7200">2 ชั่วโมง</option>
</select>

<br>

<button class="start" onclick="startTimer()">เริ่มจับเวลา</button>
<button class="stop" onclick="stopTimer()">หยุด</button>
<br>
<button class="camera" onclick="startCamera()">เปิดกล้อง</button>
<button class="stop" onclick="stopCamera()">ปิดกล้อง</button>
<button class="albumBtn" onclick="openAlbum()">ดูอัลบั้ม</button>

<div id="countdown">00:00</div>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="alertBox">
    ⚠ กรุณาเปลี่ยนท่า ⚠
    <button onclick="closeAlert()" style="font-size:20px;margin-top:20px;">ปิดแจ้งเตือน</button>
</div>

<div id="history">
    <h3>ประวัติการแจ้งเตือน</h3>
    <ul id="historyList"></ul>
</div>

<div id="album">
    <h2>อัลบั้มภาพเหตุการณ์</h2>
    <div id="albumImages"></div>
    <button onclick="closeAlbum()">ปิด</button>
</div>

<script>

let countdown;
let totalTime;
let interval;
let stream = null;
let images = [];
let alertSound = new Audio("https://www.soundjay.com/buttons/beep-07.wav");

function startTimer(){
    totalTime = parseInt(document.getElementById("timeSelect").value);
    countdown = totalTime;
    updateDisplay();
    interval = setInterval(()=>{
        countdown--;
        updateDisplay();
        if(countdown <= 0){
            triggerAlert();
        }
    },1000);
}

function stopTimer(){
    clearInterval(interval);
}

function updateDisplay(){
    let minutes = Math.floor(countdown/60);
    let seconds = countdown%60;
    document.getElementById("countdown").innerText =
        String(minutes).padStart(2,'0') + ":" +
        String(seconds).padStart(2,'0');
}

function triggerAlert(){
    clearInterval(interval);
    document.getElementById("alertBox").style.display="flex";
    alertSound.loop = true;
    alertSound.play();

    let now = new Date();
    let timeString = now.toLocaleTimeString();

    saveHistory(timeString);

    if(stream){
        takeSnapshot(timeString);
    }
}

function closeAlert(){
    document.getElementById("alertBox").style.display="none";
    alertSound.pause();
    alertSound.currentTime=0;
}

function startCamera(){
    navigator.mediaDevices.getUserMedia({video:true})
    .then(s=>{
        stream=s;
        document.getElementById("video").srcObject=s;
    })
    .catch(()=>{
        alert("ไม่สามารถเปิดกล้องได้");
    });
}

function stopCamera(){
    if(stream){
        stream.getTracks().forEach(track=>track.stop());
        stream=null;
    }
}

function takeSnapshot(timeString){
    let video=document.getElementById("video");
    let canvas=document.getElementById("canvas");
    let ctx=canvas.getContext("2d");

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    ctx.drawImage(video,0,0);

    let imageData = canvas.toDataURL("image/png");

    images.push({
        img:imageData,
        time:timeString
    });
}

function saveHistory(timeString){
    let li=document.createElement("li");
    li.innerText="แจ้งเตือนเวลา: "+timeString;
    document.getElementById("historyList").appendChild(li);
}

function openAlbum(){
    let container = document.getElementById("albumImages");
    container.innerHTML = "";

    if(images.length === 0){
        container.innerHTML = "<p>ยังไม่มีภาพเหตุการณ์</p>";
    }else{
        images.forEach(item=>{
            let box = document.createElement("div");
            box.className="snapshotBox";

            let image = document.createElement("img");
            image.src = item.img;
            image.className = "snapshot";

            let caption = document.createElement("p");
            caption.innerText="บันทึกเวลา: "+item.time;

            box.appendChild(image);
            box.appendChild(caption);
            container.appendChild(box);
        });
    }

    document.getElementById("album").style.display="block";
}

function closeAlbum(){
    document.getElementById("album").style.display="none";
}

</script>

</body>
</html>
