<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient Turn Alert</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f4f8fb;
}
h1{color:#0d3b66;}

button, select{
    padding:10px 20px;
    margin:5px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.start{background:#2a9d8f;color:white;}
.stop{background:#e63946;color:white;}
.camera{background:#457b9d;color:white;}
.download{background:#6a4c93;color:white;}

video{
    margin-top:10px;
    border-radius:10px;
    width:320px;
}

#countdown{
    font-size:40px;
    margin:15px;
    font-weight:bold;
    color:#0d3b66;
}

#alertBox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:red;
    color:white;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:50px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

#history{
    margin-top:20px;
    text-align:left;
    width:80%;
    margin-left:auto;
    margin-right:auto;
}
</style>
</head>

<body>

<h1>Patient Turn Alert</h1>

<select id="timeSelect">
    <option value="30">30 วินาที</option>
    <option value="1800">30 นาที</option>
    <option value="3600">1 ชั่วโมง</option>
    <option value="7200">2 ชั่วโมง</option>
</select>

<br>

<button class="start" onclick="startTimer()">เริ่มจับเวลา</button>
<button class="stop" onclick="stopTimer()">หยุด</button>
<br>
<button class="camera" onclick="startCamera()">เปิดกล้อง</button>
<button class="stop" onclick="stopCamera()">ปิดกล้อง</button>
<button class="download" onclick="downloadHistory()">ดาวน์โหลดประวัติ</button>

<div id="countdown">00:00</div>

<video id="video" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="alertBox">
    ⚠ กรุณาเปลี่ยนท่า ⚠
    <button onclick="closeAlert()" style="font-size:20px;margin-top:20px;">ปิดแจ้งเตือน</button>
</div>

<div id="history">
    <h3>ประวัติการแจ้งเตือน</h3>
    <ul id="historyList"></ul>
</div>

<script>
let countdown;
let totalTime;
let interval;
let stream;
let lastFrame = null;
let motionInterval;
let alertSound = new Audio("https://www.soundjay.com/buttons/beep-07.wav");

function startTimer(){
    totalTime = parseInt(document.getElementById("timeSelect").value);
    countdown = totalTime;
    updateDisplay();
    interval = setInterval(()=>{
        countdown--;
        updateDisplay();
        if(countdown <= 0){
            triggerAlert();
        }
    },1000);
}

function stopTimer(){
    clearInterval(interval);
}

function updateDisplay(){
    let minutes = Math.floor(countdown/60);
    let seconds = countdown%60;
    document.getElementById("countdown").innerText =
        String(minutes).padStart(2,'0') + ":" +
        String(seconds).padStart(2,'0');
}

function triggerAlert(){
    clearInterval(interval);
    document.getElementById("alertBox").style.display="flex";
    alertSound.loop = true;
    alertSound.play();
    takeSnapshot();
    saveHistory();
}

function closeAlert(){
    document.getElementById("alertBox").style.display="none";
    alertSound.pause();
    alertSound.currentTime=0;
}

function startCamera(){
    navigator.mediaDevices.getUserMedia({video:true})
    .then(s=>{
        stream=s;
        document.getElementById("video").srcObject=s;
        detectMotion();
    });
}

function stopCamera(){
    if(stream){
        stream.getTracks().forEach(track=>track.stop());
    }
    clearInterval(motionInterval);
}

function detectMotion(){
    motionInterval = setInterval(()=>{
        let video=document.getElementById("video");
        let canvas=document.getElementById("canvas");
        let ctx=canvas.getContext("2d");

        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0);

        let frame=ctx.getImageData(0,0,canvas.width,canvas.height);

        if(lastFrame){
            let diff=0;
            for(let i=0;i<frame.data.length;i+=4){
                diff+=Math.abs(frame.data[i]-lastFrame.data[i]);
            }
            if(diff<5000000){
                triggerAlert();
            }
        }
        lastFrame=frame;
    },5000);
}

function takeSnapshot(){
    let video=document.getElementById("video");
    let canvas=document.getElementById("canvas");
    let ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0);
}

function saveHistory(){
    let time=new Date().toLocaleString();
    let li=document.createElement("li");
    li.innerText="แจ้งเตือนเมื่อ: "+time;
    document.getElementById("historyList").appendChild(li);
}

function downloadHistory(){
    let items=document.querySelectorAll("#historyList li");
    let text="";
    items.forEach(i=>text+=i.innerText+"\n");

    let blob=new Blob([text],{type:"text/plain"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="history.txt";
    a.click();
}
</script>

</body>
</html>
