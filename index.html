<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient Turn Alert Pro</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(to right,#eaf4ff,#ffffff);
    text-align:center;
}

header{
    padding:25px;
    font-size:28px;
    font-weight:bold;
    color:#2b7cff;
}

.card{
    background:white;
    width:380px;
    margin:30px auto;
    padding:25px;
    border-radius:18px;
    box-shadow:0 12px 25px rgba(0,0,0,0.1);
}

select, button{
    padding:10px;
    border-radius:10px;
    border:none;
    margin-top:10px;
}

button{
    background:#2b7cff;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1f5edb;
}

#timer{
    font-size:18px;
    margin-top:15px;
    font-weight:bold;
}

video{
    margin-top:15px;
    border-radius:12px;
}

#alertBox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(255,0,0,0.95);
    color:white;
    text-align:center;
    padding-top:20%;
    z-index:999;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

#alertBox h2{
    font-size:42px;
}

table{
    margin-top:20px;
    width:100%;
    font-size:12px;
}
</style>
</head>

<body>

<header>Patient Turn Alert Pro</header>

<div class="card">
<h3>ตั้งเวลาแจ้งเตือน</h3>

<select id="timeSelect">
<option value="30">30 วินาที</option>
<option value="1800">30 นาที</option>
<option value="3600">1 ชั่วโมง</option>
<option value="7200">2 ชั่วโมง</option>
</select>

<br>
<button onclick="startMonitoring()">เริ่มระบบ</button>
<button onclick="downloadLog()">ดาวน์โหลดประวัติ</button>

<p id="timer">ยังไม่ได้เริ่ม</p>

<h4>กล้องตรวจจับการเคลื่อนไหว</h4>
<button onclick="startCamera()">เปิดกล้อง</button>
<br>
<video id="video" width="300" autoplay></video>

<table border="1">
<thead>
<tr><th>วันที่</th><th>เวลา</th><th>สถานะ</th></tr>
</thead>
<tbody id="logTable"></tbody>
</table>

</div>

<div id="alertBox">
<h2>⚠️ ไม่มีการเคลื่อนไหว!</h2>
<br>
<button onclick="stopAlert()">ยืนยันว่าเปลี่ยนท่าแล้ว</button>
</div>

<script>
let countdown;
let timeLeft;
let alarmSound = new Audio("https://www.soundjay.com/buttons/beep-07.wav");
let motionDetected = true;
let logData = [];
let lastImageData = null;

function startMonitoring(){
    clearInterval(countdown);
    timeLeft = document.getElementById("timeSelect").value;

    countdown = setInterval(function(){
        if(!motionDetected){
            timeLeft--;
        } else {
            timeLeft = document.getElementById("timeSelect").value;
        }

        document.getElementById("timer").innerHTML =
        "เวลาเหลือ: " + formatTime(timeLeft);

        if(timeLeft <= 0){
            clearInterval(countdown);
            triggerAlert();
        }
    },1000);
}

function formatTime(seconds){
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;
    return h+"ชม "+m+"น "+s+"วิ";
}

function triggerAlert(){
    document.getElementById("alertBox").style.display="block";
    alarmSound.loop = true;
    alarmSound.play();
    saveLog("ไม่มีการเคลื่อนไหว");
}

function stopAlert(){
    document.getElementById("alertBox").style.display="none";
    alarmSound.pause();
    alarmSound.currentTime = 0;
    timeLeft = document.getElementById("timeSelect").value;
}

function saveLog(status){
    let now = new Date();
    let date = now.toLocaleDateString();
    let time = now.toLocaleTimeString();
    logData.push([date,time,status]);

    let row = "<tr><td>"+date+"</td><td>"+time+"</td><td>"+status+"</td></tr>";
    document.getElementById("logTable").innerHTML += row;
}

function downloadLog(){
    let csv = "วันที่,เวลา,สถานะ\n";
    logData.forEach(row=>{
        csv += row.join(",") + "\n";
    });

    let blob = new Blob([csv], { type: 'text/csv' });
    let url = window.URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "patient_log.csv";
    a.click();
}

function startCamera(){
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream=>{
        document.getElementById("video").srcObject = stream;
        monitorMotion();
    });
}

function monitorMotion(){
    const video = document.getElementById("video");
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    setInterval(()=>{
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0);
        let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);

        if(lastImageData){
            let diff = 0;
            for(let i=0;i<imageData.data.length;i+=4){
                diff += Math.abs(imageData.data[i] - lastImageData.data[i]);
            }
            motionDetected = diff > 1000000;
        }

        lastImageData = imageData;
    },2000);
}
</script>

</body>
</html>
