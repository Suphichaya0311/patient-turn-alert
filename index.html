<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turning Care System</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#e6fff4;
  color:#065f46;
  overflow-x:hidden;
}

/* ===== วงกลมลอย ===== */
.circle{
  position:fixed;
  border-radius:50%;
  background:rgba(16,185,129,0.2);
  animation:float 8s infinite ease-in-out;
  z-index:-1;
}
.circle:nth-child(1){width:200px;height:200px;top:10%;left:5%;}
.circle:nth-child(2){width:150px;height:150px;bottom:15%;right:10%;animation-delay:2s;}
.circle:nth-child(3){width:250px;height:250px;top:50%;left:70%;animation-delay:4s;}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-30px);}
  100%{transform:translateY(0);}
}

/* ===== เส้นชีพจร ===== */
.heartbeat-line{
  position:fixed;
  bottom:0;
  width:200%;
  height:80px;
  background:url('https://svgshare.com/i/14Yp.svg') repeat-x;
  background-size:contain;
  animation:moveLine 8s linear infinite;
  opacity:0.5;
}
@keyframes moveLine{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ===== Welcome ===== */
#welcome{
  position:fixed;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:10;
}

#welcome video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(6px) brightness(60%);
}

.overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
  padding:60px;
  border-radius:30px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(15px);
  box-shadow:0 0 40px rgba(16,185,129,0.8);
}

.overlay h1{font-size:50px;}
.overlay p{font-size:20px;margin-bottom:20px;}

button{
  padding:12px 30px;
  margin:10px;
  border:none;
  border-radius:30px;
  background:#10b981;
  color:white;
  cursor:pointer;
  font-size:16px;
  box-shadow:0 0 15px #34d399;
}

button:hover{transform:scale(1.05);}

<!-- Alert -->
<div class="alert" id="alertBox">
  ⛔ ถึงเวลาพลิกตัวผู้ป่วย ⛔
  <br><br>
  <button onclick="stopAlert()">ปิดแจ้งเตือน</button>
</div>

<!-- Main -->
<div class="container" id="mainSystem">
  <h2>ระบบแจ้งเตือนพลิกตัวผู้ป่วย</h2>

  <select id="timeSelect">
    <option value="30">30 วินาที</option>
    <option value="1800">30 นาที</option>
    <option value="3600">1 ชั่วโมง</option>
    <option value="7200">2 ชั่วโมง</option>
  </select>
  <br>

  <button onclick="startTimer()">เริ่ม</button>
  <button onclick="resetTimer()">รีเซ็ต</button>

  <div id="countdown">00:00</div>

  <h3>กล้อง</h3>
  <video id="camera" autoplay></video>
  <br>
  <button onclick="startCamera()">เปิดกล้อง</button>
  <button onclick="stopCamera()">ปิดกล้อง</button>

  <div class="history">
    <h3>ประวัติการแจ้งเตือน</h3>
    <ul id="historyList"></ul>
  </div>

  <div class="album">
    <h3>อัลบั้มรูปจากกล้อง</h3>
    <div id="albumList"></div>
  </div>
</div>

<audio id="alarmSound" src="alarm.mp3" loop></audio>

<script>
let timer;
let timeLeft=0;
let stream=null;

function enterSystem(){
  document.getElementById("welcome").style.display="none";
  document.getElementById("mainSystem").style.display="block";
}

function startTimer(){
  clearInterval(timer);
  timeLeft=parseInt(document.getElementById("timeSelect").value);
  updateDisplay();
  timer=setInterval(()=>{
    timeLeft--;
    updateDisplay();
    if(timeLeft<=0){
      clearInterval(timer);
      triggerAlert();
    }
  },1000);
}

function resetTimer(){
  clearInterval(timer);
  timeLeft=0;
  updateDisplay();
}

function updateDisplay(){
  let min=Math.floor(timeLeft/60);
  let sec=timeLeft%60;
  document.getElementById("countdown").innerText=
    String(min).padStart(2,'0')+":"+
    String(sec).padStart(2,'0');
}

function triggerAlert(){
  document.getElementById("alertBox").style.display="flex";
  document.getElementById("alarmSound").play();
  saveHistory();
  capturePhoto();
}

function stopAlert(){
  document.getElementById("alertBox").style.display="none";
  let sound=document.getElementById("alarmSound");
  sound.pause();
  sound.currentTime=0;
}

function saveHistory(){
  let now=new Date();
  let timeString=now.toLocaleString();
  let li=document.createElement("li");
  li.textContent="แจ้งเตือนเมื่อ: "+timeString;
  document.getElementById("historyList").appendChild(li);
}

async function startCamera(){
  stream=await navigator.mediaDevices.getUserMedia({video:true});
  document.getElementById("camera").srcObject=stream;
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }
}

function capturePhoto(){
  if(!stream) return;

  let video=document.getElementById("camera");
  let canvas=document.createElement("canvas");
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  let ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  let now=new Date();
  let timeString=now.toLocaleString();

  let box=document.createElement("div");
  box.className="photo-box";

  let img=document.createElement("img");
  img.src=canvas.toDataURL("image/png");

  let time=document.createElement("div");
  time.className="photo-time";
  time.textContent="บันทึกเมื่อ: "+timeString;

  box.appendChild(img);
  box.appendChild(time);

  document.getElementById("albumList").appendChild(box);
}

/* วงกลมลอย */
for(let i=0;i<25;i++){
  let circle=document.createElement("div");
  circle.className="circle";
  let size=Math.random()*100+30;
  circle.style.width=size+"px";
  circle.style.height=size+"px";
  circle.style.left=Math.random()*100+"%";
  circle.style.animationDuration=(Math.random()*15+10)+"s";
  document.body.appendChild(circle);
}
</script>

</body>
</html>
