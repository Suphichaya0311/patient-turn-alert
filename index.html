<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turning Care System</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#e6fff4;
  color:#065f46;
  overflow-x:hidden;
}

/* ===== วงกลมลอย ===== */
.circle{
  position:fixed;
  border-radius:50%;
  background:rgba(16,185,129,0.2);
  animation:float 8s infinite ease-in-out;
  z-index:-1;
}
.circle:nth-child(1){width:200px;height:200px;top:10%;left:5%;}
.circle:nth-child(2){width:150px;height:150px;bottom:15%;right:10%;animation-delay:2s;}
.circle:nth-child(3){width:250px;height:250px;top:50%;left:70%;animation-delay:4s;}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-30px);}
  100%{transform:translateY(0);}
}

/* ===== เส้นชีพจร ===== */
.heartbeat-line{
  position:fixed;
  bottom:0;
  width:200%;
  height:80px;
  background:url('https://svgshare.com/i/14Yp.svg') repeat-x;
  background-size:contain;
  animation:moveLine 8s linear infinite;
  opacity:0.5;
}
@keyframes moveLine{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ===== Welcome ===== */
#welcome{
  position:fixed;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:10;
}

#welcome video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(6px) brightness(60%);
}

.overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
  padding:60px;
  border-radius:30px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(15px);
  box-shadow:0 0 40px rgba(16,185,129,0.8);
}

.overlay h1{font-size:50px;}
.overlay p{font-size:20px;margin-bottom:20px;}

button{
  padding:12px 30px;
  margin:10px;
  border:none;
  border-radius:30px;
  background:#10b981;
  color:white;
  cursor:pointer;
  font-size:16px;
  box-shadow:0 0 15px #34d399;
}

button:hover{transform:scale(1.05);}

/* ===== ระบบหลัก ===== */
#main{
  display:none;
  padding:80px 20px;
  text-align:center;
}

.card{
  background:white;
  padding:40px;
  border-radius:25px;
  box-shadow:0 0 30px #34d399;
  max-width:700px;
  margin:auto;
}

input{
  padding:10px;
  border-radius:10px;
  border:1px solid #10b981;
}

#camera{
  width:100%;
  margin-top:20px;
  border-radius:20px;
  box-shadow:0 0 20px #34d399;
}

#album img{
  width:150px;
  margin:10px;
  border-radius:15px;
  box-shadow:0 0 10px #34d399;
}

/* ===== แจ้งเตือนเต็มจอ ===== */
#alertBox{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
  z-index:20;
}

.alertContent{
  background:white;
  padding:40px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 30px red;
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="heartbeat-line"></div>

<!-- ===== หน้า Welcome ===== -->
<div id="welcome">
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="เต้น.mp4" type="video/mp4">
  </video>

  <div class="overlay">
    <h1>Turning Care System</h1>
    <p>ระบบแจ้งเตือนการพลิกตัวผู้ป่วยอัตโนมัติ</p>
    <button onclick="toggleSound()">🔊 เปิดเสียง</button>
    <button onclick="enterSystem()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ===== ระบบหลัก ===== -->
<div id="main">
  <div class="card">
    <h2>ตั้งเวลาแจ้งเตือน (วินาที)</h2>
    <input type="number" id="seconds" placeholder="เช่น 10">
    <button onclick="startTimer()">เริ่ม</button>
    <h3 id="countdown"></h3>

    <br>
    <button onclick="startCamera()">เปิดกล้อง</button>
    <button onclick="stopCamera()">ปิดกล้อง</button>

    <video id="camera" autoplay></video>

    <h3>อัลบั้มรูป</h3>
    <div id="album"></div>

    <button onclick="goHome()">กลับหน้าแรก</button>
  </div>
</div>

<!-- ===== แจ้งเตือน ===== -->
<div id="alertBox">
  <div class="alertContent">
    <h2>ถึงเวลาพลิกตัวผู้ป่วย!</h2>
    <button onclick="closeAlert()">ปิด</button>
  </div>
</div>

<script>
let timer;
let stream;

function toggleSound(){
  const video=document.getElementById("bgVideo");
  video.muted=false;
  video.play();
}

function enterSystem(){
  document.getElementById("welcome").style.display="none";
  document.getElementById("bgVideo").pause();
  document.getElementById("main").style.display="block";
}

function goHome(){
  document.getElementById("main").style.display="none";
  document.getElementById("welcome").style.display="block";
  document.getElementById("bgVideo").play();
}

function startCamera(){
  navigator.mediaDevices.getUserMedia({video:true})
  .then(s=>{
    stream=s;
    document.getElementById("camera").srcObject=s;
  });
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }
}

function startTimer(){
  let sec=document.getElementById("seconds").value;
  let count=sec;
  timer=setInterval(()=>{
    document.getElementById("countdown").innerText="เหลือ "+count+" วินาที";
    count--;
    if(count<0){
      clearInterval(timer);
      showAlert();
      capturePhoto();
    }
  },1000);
}

function showAlert(){
  document.getElementById("alertBox").style.display="flex";
  let audio=new Audio("https://www.soundjay.com/buttons/sounds/beep-07.mp3");
  audio.play();
}

function closeAlert(){
  document.getElementById("alertBox").style.display="none";
}

function capturePhoto(){
  const video=document.getElementById("camera");
  if(!video.srcObject) return;

  const canvas=document.createElement("canvas");
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  const img=document.createElement("img");
  img.src=canvas.toDataURL("image/png");

  const time=document.createElement("p");
  time.innerText="บันทึกเวลา: "+new Date().toLocaleTimeString();

  document.getElementById("album").appendChild(img);
  document.getElementById("album").appendChild(time);
}
</script>

</body>
</html>
