<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turning Care System</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background: linear-gradient(-45deg,#d4f8e8,#b7f7d4,#9df0c0,#c8ffe6);
    background-size:400% 400%;
    animation: gradientBG 12s ease infinite;
    overflow-x:hidden;
}
@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ===== Welcome Screen ===== */
#welcome, #menuScreen{
    position:fixed;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#b2f7d8,#8ef0c3);
    z-index:1000;
}

#welcome h1{
    font-size:55px;
    color:#065f46;
}

button{
    padding:12px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#10b981;
    color:white;
    cursor:pointer;
    margin:10px;
    box-shadow:0 0 15px #34d399;
}
button:hover{
    transform:scale(1.05);
}

/* ===== Floating Circles ===== */
.circle{
    position:fixed;
    bottom:-100px;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    animation: floatUp linear infinite;
    z-index:0;
}
@keyframes floatUp{
    from{transform:translateY(0);}
    to{transform:translateY(-120vh);}
}

/* ===== ECG ===== */
.ecg{
    position:fixed;
    bottom:0;
    width:100%;
    height:120px;
    background:url('https://i.imgur.com/3Xj3Z5K.png') repeat-x;
    background-size:contain;
    animation:ecgMove 6s linear infinite;
    opacity:0.25;
    z-index:0;
}
@keyframes ecgMove{
    from{background-position:0 0;}
    to{background-position:1000px 0;}
}

/* ===== Main Container ===== */
.container{
    display:none;
    position:relative;
    margin:100px auto;
    width:85%;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.85);
    box-shadow:0 0 40px #10b981;
    text-align:center;
    z-index:2;
}

#countdown{
    font-size:55px;
    margin:20px 0;
    color:#065f46;
}

#history{
    margin-top:20px;
    max-height:150px;
    overflow:auto;
    text-align:left;
    padding:10px;
    background:#eafff6;
    border-radius:15px;
}

#album{
    display:none;
    margin-top:20px;
}

img{
    max-width:200px;
    margin:10px;
    border-radius:15px;
}
</style>
</head>

<body>

<!-- Welcome -->
<div id="welcome">
    <h1>Turning Care System</h1>
    <button onclick="goMenu()">เข้าสู่ระบบ</button>
</div>

<!-- Menu Screen -->
<div id="menuScreen" style="display:none;">
    <h2>เมนูหลัก</h2>
    <button onclick="enterMain()">เข้าใช้งานระบบแจ้งเตือน</button>
</div>

<div class="ecg"></div>

<!-- Main System -->
<div class="container" id="mainSystem">
    <h2>ระบบแจ้งเตือนพลิกตัวผู้ป่วย</h2>

    <h1 id="countdown">00:30</h1>
    <button onclick="startTimer()">เริ่ม</button>
    <button onclick="stopTimer()">หยุด</button>
    <button onclick="toggleAlbum()">ดูอัลบั้ม</button>

    <h3>ประวัติการแจ้งเตือน</h3>
    <div id="history"></div>

    <h3>ภาพท่าพลิกตัว</h3>
    <img src="เวลาพลิกตัว.jpg">

    <div id="album">
        <h3>อัลบั้ม</h3>
        <div id="albumImages"></div>
    </div>
</div>

<script>
let timer;
let seconds = 30;
let original = 30;

function goMenu(){
    document.getElementById("welcome").style.display="none";
    document.getElementById("menuScreen").style.display="flex";
}

function enterMain(){
    document.getElementById("menuScreen").style.display="none";
    document.getElementById("mainSystem").style.display="block";
}

function startTimer(){
    timer = setInterval(()=>{
        seconds--;
        updateDisplay();
        if(seconds<=0){
            clearInterval(timer);
            alert("ถึงเวลาพลิกตัวผู้ป่วย!");
            saveRecord();
            seconds=original;
        }
    },1000);
}

function stopTimer(){
    clearInterval(timer);
}

function updateDisplay(){
    let min=Math.floor(seconds/60);
    let sec=seconds%60;
    document.getElementById("countdown").innerText=
        String(min).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}

function saveRecord(){
    let now=new Date();
    let timeString=now.toLocaleTimeString();

    let record=document.createElement("div");
    record.innerText="แจ้งเตือนเมื่อ: "+timeString;
    document.getElementById("history").appendChild(record);

    let img=document.createElement("img");
    img.src="เวลาพลิกตัว.jpg";
    document.getElementById("albumImages").appendChild(img);
}

function toggleAlbum(){
    let album=document.getElementById("album");
    album.style.display=album.style.display==="none"?"block":"none";
}

/* สร้างวงกลมลอยแบบเห็นชัด */
for(let i=0;i<20;i++){
    let circle=document.createElement("div");
    circle.className="circle";
    let size=Math.random()*80+30;
    circle.style.width=size+"px";
    circle.style.height=size+"px";
    circle.style.left=Math.random()*100+"%";
    circle.style.animationDuration=(Math.random()*10+10)+"s";
    document.body.appendChild(circle);
}
</script>

</body>
</html>
